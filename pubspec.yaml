name: smartvision
description: SmartVision - AI Mobility Assistant untuk tunanetra
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Kamera native Android
  camera: ^0.10.5+9

  # TTS native Android
  flutter_tts: ^4.2.5

  # STT native Android
  speech_to_text: ^7.4.0

  # Buka Google Maps
  url_launcher: ^6.3.0

  # GPS
  geolocator: ^12.0.0

  # Permission handler
  permission_handler: ^11.3.1

  # HTTP untuk Gemini API
  http: ^1.2.0

  android_intent_plus: ^5.3.0

  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
